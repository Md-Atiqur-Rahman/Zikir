name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Set up the permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZIKIR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZIKIR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing secrets ZIKIR_KEYSTORE_BASE64 / ZIKIR_KEYSTORE_PASSWORD (repo Settings > Secrets and variables > Actions). Without them the APK would be signed with a throw-away key and could not update an installed app."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zikir-release.p12"
          echo "ZIKIR_KEYSTORE=$RUNNER_TEMP/zikir-release.p12" >> "$GITHUB_ENV"
          echo "ZIKIR_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      # the build number is the Android versionCode; the app compares it with the release tag
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Zikir.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zikir-apk
          path: Zikir.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zikir build ${{ github.run_number }}
          files: Zikir.apk
